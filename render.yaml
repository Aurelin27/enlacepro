services:
  - type: web
    name: enlacepro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enlacepro-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://enlacepro.onrender.com
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASICO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BASICO_YEARLY
        sync: false
      - key: STRIPE_PRICE_VIP_MONTHLY
        sync: false
      - key: STRIPE_PRICE_VIP_YEARLY
        sync: false

databases:
  - name: enlacepro-db
    databaseName: enlacepro
    user: enlacepro
